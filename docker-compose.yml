services:
  db:
    # Postgres 16 with the pgvector extension (vector search for the RAG knowledge base).
    # Uses a NEW volume so the old postgres:16-alpine data in `pgdata` is left untouched (see docs/RAG.md).
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: health_user
      POSTGRES_PASSWORD: health_pass
      POSTGRES_DB: health_db
    volumes:
      - pgdata_pgvector:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U health_user -d health_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://health_user:health_pass@db:5432/health_db
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      OPENFDA_API_KEY: ${OPENFDA_API_KEY:-}
      # Gemini is used only where Python cannot do the job (see docs/GEMINI_USAGE.md)
      RAG_EMBEDDER: ${RAG_EMBEDDER:-local}
      RAG_ENTAILMENT: ${RAG_ENTAILMENT:-lexical}
      ECG_LLM_SUMMARY: ${ECG_LLM_SUMMARY:-0}
      ECG_DEMO_MODE: ${ECG_DEMO_MODE:-false}
      UPLOAD_DIR: /app/uploads
    volumes:
      - ./backend:/app
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:20-alpine
    working_dir: /app
    environment:
      - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID:-546856015109-alem635ribkesbu59161ujmnm30rnr9u.apps.googleusercontent.com}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host"
    depends_on:
      - backend

volumes:
  pgdata:            # old postgres:16-alpine data (kept for rollback; no longer mounted)
  pgdata_pgvector:
  uploads:
